name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar cada ejercicio con una entrada de prueba
        run: |
          echo  "1" | python3 ej05_menu.py
          echo  "7" | python3 ej03_tabla_multiplicar.py
          echo  "23" | python3 ej07_fizzbuzz.py
